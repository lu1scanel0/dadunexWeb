name: Deploy Dadunex Admin

on:
  push:
    branches:
      - main
    paths:
      - "dadunex-admin/**"
      - ".github/workflows/deploy-admin.yml"

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verificar estructura
        run: |
          test -f dadunex-admin/index.html
          test -d dadunex-admin/css
          test -d dadunex-admin/js

      - name: Publicar administrador en S3
        run: |
          aws s3 sync dadunex-admin/ s3://${{ secrets.ADMIN_S3_BUCKET }} \
            --delete \
            --exclude ".DS_Store" \
            --exclude "*.zip"

      - name: Limpiar caché CloudFront Admin
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.ADMIN_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

      - name: Despliegue completado
        run: |
          echo "========================================"
          echo "Dadunex Admin desplegado correctamente"
          echo "Bucket: ${{ secrets.ADMIN_S3_BUCKET }}"
          echo "CloudFront invalidado correctamente"
          echo "========================================"